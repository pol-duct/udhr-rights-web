                    <header className="bg-navy py-16 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
                        {/* Decorative background element */}
                        <div className="absolute top-0 left-0 w-full h-full overflow-hidden opacity-10 pointer-events-none">
                            <div className="absolute -top-24 -right-24 w-96 h-96 bg-accent rounded-full blur-3xl"></div>
                            <div className="absolute top-1/2 -left-24 w-64 h-64 bg-blue-400 rounded-full blur-3xl"></div>
                        </div>

                        <div className="max-w-4xl mx-auto text-center relative z-10">
                            <h1 className="text-3xl sm:text-4xl md:text-5xl font-bold text-white mb-4 leading-tight">
                                สิทธิมนุษยชน <span className="text-accent">30 ประการ</span>
                            </h1>
                            <p className="text-slate-300 text-base sm:text-lg mb-10 max-w-2xl mx-auto">
                                สรุปความรู้และกรณีศึกษาตามปฏิญญาสากลว่าด้วยสิทธิมนุษยชน (Universal Declaration of Human Rights - UDHR) เพื่อความเข้าใจในสิทธิขั้นพื้นฐานของทุกคน
                            </p>
                            
                            {/* Search Bar */}
                            <div className="relative max-w-xl mx-auto">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                    <SearchIcon />
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="ค้นหาสิทธิด้วยคำค้นหา หรือ ข้อที่..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="block w-full pl-12 pr-4 py-4 rounded-full bg-white text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-accent/30 shadow-lg transition-shadow text-sm sm:text-base"
                                />
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
                        
                        {}
                        <SituationAnalyzer udhrData={udhrData} onArticleClick={setSelectedArticle} />

                        {/* Search Results Summary */}
                        {searchQuery && (
                            <div className="mb-6 text-slate-600 font-medium text-center sm:text-left">
                                พบผลลัพธ์ {filteredData.length} รายการ สำหรับการค้นหา "{searchQuery}"
                            </div>
                        )}

                        {/* Grid */}
                        {filteredData.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {filteredData.map((article) => (
                                    <ArticleCard 
                                        key={article.id} 
                                        article={article} 
                                        onClick={setSelectedArticle}
                                    />
                                ))}
                            </div>
                        ) : (
                            <div className="text-center py-20">
                                <div className="inline-block p-4 bg-white rounded-full shadow-sm mb-4 text-slate-400">
                                    <SearchIcon />
                                </div>
                                <h3 className="text-xl font-medium text-slate-700 mb-2">ไม่พบข้อมูลที่ค้นหา</h3>
                                <p className="text-slate-500">ลองใช้คำค้นหาอื่น หรือค้นหาจากหมายเลขข้อ 1-30</p>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 py-8 text-center text-slate-400 text-sm">
                        <p>© {new Date().getFullYear()} โครงการเรียนรู้สิทธิมนุษยชน (UDHR Educational Portal)</p>
                        <p className="mt-1">ออกแบบเพื่อส่งเสริมความรู้และความตระหนักในสิทธิมนุษยชนสากล</p>
                    </footer>

                    {/* Modal */}
                    <ArticleModal 
                        article={selectedArticle} 
                        onClose={() => setSelectedArticle(null)} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
