                description: "สิทธิข้อ 23 รับรองว่าทุกคนมีสิทธิในการทำงาน สามารถเลือกงานได้อย่างอิสระ และควรได้รับเงื่อนไขการทำงานที่ยุติธรรมและเอื้ออำนวย รวมถึงได้รับการคุ้มครองจากการว่างงาน ทุกคนมีสิทธิได้รับค่าจ้างที่เท่าเทียมกันสำหรับงานที่มีคุณค่าเท่าเทียมกันโดยปราศจากการเลือกปฏิบัติ ผู้ทำงานมีสิทธิได้รับค่าตอบแทนที่เป็นธรรมและเพียงพอต่อการดำรงชีวิตของตนเองและครอบครัว นอกจากนี้ยังมีสิทธิในการจัดตั้งและเข้าร่วมสหภาพแรงงานเพื่อคุ้มครองผลประโยชน์ของตน",

                    { 
                        text: "ประเทศไทยประกาศอัตราค่าจ้างขั้นต่ำฉบับใหม่ซึ่งมีผลตั้งแต่วันที่ 1 มกราคม พ.ศ. 2568 โดยอัตราค่าจ้างแตกต่างกันตามพื้นที่ ตั้งแต่ 337–400 บาทต่อวัน การกำหนดค่าจ้างขั้นต่ำมีความเกี่ยวข้องโดยตรงกับสิทธิในการทำงานตามข้อ 23 เนื่องจากค่าจ้างเป็นองค์ประกอบสำคัญของเงื่อนไขการทำงานที่เป็นธรรม กฎหมายแรงงานกำหนดให้นายจ้างไม่สามารถจ่ายค่าจ้างต่ำกว่าอัตราค่าจ้างขั้นต่ำที่กำหนด นอกจากเรื่องค่าจ้างแล้ว กฎหมายยังระบุเรื่องเวลาทำงาน โดยงานทั่วไปมีเวลาทำงานปกติไม่เกิน 8 ชั่วโมงต่อวัน ขณะที่งานบางประเภทที่อาจเป็นอันตรายต่อสุขภาพและความปลอดภัยมีข้อกำหนดเรื่องเวลาทำงานที่สั้นลง กรณีนี้สะท้อนความพยายามกำหนดมาตรฐานขั้นต่ำในการจ้างงาน เพื่อให้ผู้ทำงานได้รับค่าตอบแทนและเงื่อนไขการทำงานที่ไม่ต่ำกว่ามาตรฐานที่กฎหมายกำหนด ทั้งนี้ การกำหนดค่าจ้างขั้นต่ำยังเป็นประเด็นที่เกี่ยวข้องกับทั้งลูกจ้าง นายจ้าง และภาครัฐ เนื่องจากต้องพิจารณาทั้งค่าครองชีพ สภาพเศรษฐกิจ และความสามารถของนายจ้าง",

                        text: "ในปี พ.ศ. 2567 ประเทศไทยมีการออกกฎกระทรวงเกี่ยวกับการคุ้มครองแรงงานทำงานบ้าน โดยเพิ่มสิทธิและหลักประกันให้แก่คนทำงานในบ้าน เช่น คนทำความสะอาด คนทำอาหาร ผู้ดูแลผู้สูงอายุ และคนขับรถ กฎดังกล่าวกำหนดเวลาทำงานไม่เกิน 8 ชั่วโมงต่อวัน มีเวลาพัก และกำหนดให้มีวันหยุดประจำสัปดาห์อย่างน้อย 1 วัน รวมถึงวันหยุดตามประเพณีที่ได้รับค่าจ้างไม่น้อยกว่า 13 วันต่อปี และวันหยุดพักผ่อนประจำปีไม่น้อยกว่า 6 วันเมื่อทำงานครบหนึ่งปี นอกจากนี้ยังมีการคุ้มครองเกี่ยวกับการลาคลอดและห้ามเลิกจ้างเพราะการตั้งครรภ์ รวมถึงกำหนดข้อจำกัดเกี่ยวกับการหักค่าจ้าง กรณีศึกษานี้สะท้อนการขยายหลักการคุ้มครองแรงงานไปยังกลุ่มแรงงานที่มีลักษณะการทำงานแตกต่างจากลูกจ้างในสถานประกอบการทั่วไป โดยให้ความสำคัญกับค่าจ้าง ชั่วโมงการทำงาน วันหยุด และการคุ้มครองจากการเลือกปฏิบัติ หลักการดังกล่าวสอดคล้องกับสิทธิข้อ 23 ที่กำหนดให้ทุกคนมีสิทธิทำงานภายใต้เงื่อนไขที่ยุติธรรมและเหมาะสม",

                        text: "ในปี พ.ศ. 2568 ระบบหลักประกันสุขภาพถ้วนหน้าของประเทศไทยได้รับการพัฒนาไปสู่ 30 บาทรักษาทุกที่ โดยครอบคลุมการให้บริการทั่วประเทศ ประชาชนที่มีสิทธิบัตรทองสามารถใช้บัตรประชาชนเพื่อเข้าถึงบริการสุขภาพในหน่วยบริการปฐมภูมิที่เข้าร่วม โดยมีบริการหลายรูปแบบ เช่น การรักษาโรคทั่วไป บริการร้านยาคุณภาพ การทำฟัน และบริการทางการแพทย์บางประเภทระบบหลักประกันสุขภาพถ้วนหน้ามีประชาชนอยู่ในระบบประมาณ 49.8 ล้านคน หรือประมาณร้อยละ 74 ของประชากรไทย การมีระบบดังกล่าวช่วยลดภาระค่าใช้จ่ายด้านสุขภาพของประชาชน โดยเฉพาะผู้ที่ไม่มีประกันสุขภาพจากระบบอื่น กรณีนี้เกี่ยวข้องโดยตรงกับสิทธิข้อ 25 เนื่องจากสิทธิในมาตรฐานการครองชีพที่เหมาะสมไม่ได้หมายถึงการมีอาหารและที่อยู่อาศัยเท่านั้น แต่ยังรวมถึงสิทธิในการเข้าถึงการรักษาพยาบาลและบริการทางสังคมที่จำเป็นต่อสุขภาพ การพัฒนาระบบ 30 บาทรักษาทุกที่จึงเป็นตัวอย่างของการจัดบริการสาธารณะที่มุ่งให้ประชาชนเข้าถึงการรักษาได้สะดวกขึ้นและลดอุปสรรคด้านค่าใช้จ่าย

                        text: "ปัญหาสิทธิในที่อยู่อาศัยยังเป็นประเด็นที่เกิดขึ้นในหลายพื้นที่ของประเทศไทย โดยเฉพาะชุมชนที่ได้รับผลกระทบจากโครงการพัฒนาขนาดใหญ่ ในปี พ.ศ. 2568 Amnesty International Thailand รายงานประเด็นเกี่ยวกับสิทธิในที่อยู่อาศัยและความเสี่ยงต่อการถูกไล่รื้อของชุมชนจากโครงการต่าง ๆ เช่น เหมืองแร่ ป่าคาร์บอน และโครงการแลนด์บริดจ์ โดยชี้ให้เห็นว่าที่อยู่อาศัยไม่ได้หมายถึงเพียงตัวบ้าน แต่เกี่ยวข้องกับที่ดิน แหล่งน้ำ การประกอบอาชีพ และความมั่นคงในการดำรงชีวิต ข้อมูลจากคณะกรรมการสิทธิมนุษยชนแห่งชาติที่เผยแพร่ในกิจกรรมดังกล่าวระบุว่า ในปี 2567 มีคำร้องเกี่ยวกับสิทธิในที่อยู่อาศัย 21 คำร้อง และสิทธิในที่ดิน 35 คำร้อง สะท้อนว่าประเด็นที่อยู่อาศัยยังเป็นปัญหาที่ประชาชนร้องเรียนต่อหน่วยงานด้านสิทธิมนุษยชน กรณีนี้แสดงให้เห็นว่าสิทธิในมาตรฐานการครองชีพที่เหมาะสมตามข้อ 25 ครอบคลุมมากกว่าการมีบ้านเป็นที่พักอาศัย แต่ยังรวมถึงความมั่นคงในการอยู่อาศัยและการเข้าถึงทรัพยากรที่จำเป็นต่อการดำรงชีวิต เช่น ที่ดินและน้ำ",

                id: 26, 
                articleNumber: 26, 
                title: "สิทธิในการศึกษา", 
                description: "ทุกคนมีสิทธิในการศึกษา การศึกษาจะต้องให้เปล่าอย่างน้อยในชั้นประถมศึกษาและขั้นพื้นฐาน การประถมศึกษาจะต้องเป็นการบังคับ การศึกษาทางเทคนิคและวิชาอาชีพจะต้องเป็นการทั่วไป และการศึกษาระดับที่สูงขึ้นไปจะต้องเข้าถึงได้อย่างเสมอภาคสำหรับทุกคนบนพื้นฐานของคุณสมบัติความเหมาะสม การศึกษาจะต้องมุ่งไปสู่การพัฒนาบุคลิกภาพของมนุษย์อย่างเต็มที่ และการเสริมสร้างความเคารพต่อสิทธิมนุษยชนและอิสรภาพขั้นพื้นฐาน การศึกษาจะต้องส่งเสริมความเข้าใจ ขันติธรรมและมิตรภาพระหว่างประชาชาติ กลุ่มเชื้อชาติหรือศาสนาทั้งมวล และจะต้องส่งเสริมกิจกรรมของสหประชาชาติเพื่อการธำรงไว้ซึ่งสันติภาพ ผู้ปกครองย่อมมีสิทธิเบื้องแรกที่จะเลือกประเภทการศึกษาให้แก่บุตรของตน", 
                caseStudies: [
                    { 
                        text: "ปัญหาการหลุดออกจากระบบการศึกษาเป็นความท้าทายโดยเฉพาะอย่างยิ่งสำหรับเด็กผู้หญิงที่มักตกอยู่ในภาวะเปราะบางทางเพศสภาพและภาระทางสังคมที่ทับซ้อนกันจนนำไปสู่การสูญเสียโอกาสทางชีวิต เรื่องราวของมิ้ว วัยรุ่นหญิงอายุ 17 ปี เธอเคยมีความฝันอยากเป็นแพทย์ แต่ความฝันนั้นต้องพังทลายลงเมื่อเธอจำเป็นต้องลาออกจากโรงเรียนเพื่อมาดูแลยายที่ป่วยหนักและตั้งครรภ์โดยไม่พร้อม ทำให้ต้องหลุดจากการศึกษานอกระบบ (กศน.) และต้องมาพึ่งพิงอาศัยที่บ้านพักฉุกเฉินดอนเมือง เช่นเดียวกับกรณีของแตงกวา เด็กสาวอีกคนที่ต้องเผชิญกับอุปสรรคทางครอบครัวและสังคมจนหลุดจากระบบการศึกษาซ้ำแล้วซ้ำเล่า ก่อให้เกิดคำถามว่า หากเด็กผู้หญิงเหล่านี้ได้รับการสนับสนุนอย่างทันท่วงทีตั้งแต่ต้น อนาคตของพวกเธอจะเปลี่ยนไปในทิศทางที่ดีกว่านี้หรือไม่ บ้านพักฉุกเฉิน ภายใต้การดูแลของ อุษา เลิศศรีสันทัด ไม่ได้เป็นเพียงสถานที่หลบภัยสำหรับสตรีที่เผชิญปัญหาความรุนแรงหรือท้องไม่พร้อมเท่านั้น แต่ยังมีการฟื้นฟูความเข้มแข็งและสร้างพลังใจให้แก่ผู้หญิงและลูก ๆ ของพวกเธอ โดยมุ่งเน้นการดูแลไม่ให้เด็กในความดูแลหลุดออกจากระบบการศึกษา นอกจากนี้ยังมีการส่งเสริมทักษะอาชีพ เช่น การเปิดหลักสูตรสอนทำขนม เพื่อเป็นเครื่องมือสร้างรายได้ในอนาคตและช่วยสนับสนุนค่าใช้จ่ายของมูลนิธิไปในตัว อย่างไรก็ตาม การแก้ปัญหานี้ไม่อาจพึ่งพาเพียงภาคประชาสังคมได้ แต่ต้องอาศัยการผลักดันเชิงระบบ โดยเฉพาะการรณรงค์ให้สถานศึกษาและครูมีความเข้าใจในความหลากหลายของนักเรียน ระบบการศึกษาต้องมีความยืดหยุ่นและมีมาตรการรองรับเพื่อช่วยเหลือเด็กที่ตั้งครรภ์ในวัยเรียนให้สามารถเรียนต่อได้ตามสิทธิ โดยไม่ต้องพึ่งพาเพียงสปิริตหรือความเมตตาส่วนตัวของครูเป็นรายบุคคล การสร้างระบบโครงข่ายความคุ้มครองทางสังคมและการศึกษาที่เข้มแข็งเท่านั้นที่จะช่วยยุติวงจรการหลุดจากระบบ และคืนอนาคตที่พวกเธอควรมีสิทธิเลือกได้ด้วยตัวเองกลับมา", 
                        url: "https://www.eef.or.th/drop-out-kids-in-emergency-home/" 
                    },
                    { 
                        text: "ปัญหาการเข้าถึงสิทธิทางการศึกษากรณีเด็ก 23 คนที่เกิดในพื้นที่พักพิงชั่วคราวบ้านนุโพ อำเภออุ้มผาง จังหวัดตาก ซึ่งถูกโรงเรียนรัฐบาลปฏิเสธการรับเข้าเรียนในระดับชั้นอนุบาล เหตุการณ์นี้ถูกเปิดเผยผ่านเพจเฟซบุ๊กคลินิกกฎหมายอุ้มผาง โครงการสี่หมอชายแดน จ.ตาก นำมาซึ่งข้อกังขาจากสังคมเกี่ยวกับสิทธิขั้นพื้นฐานที่เด็กทุกคนควรได้รับอย่างเท่าเทียมตามหลักสิทธิมนุษยชน อุปสรรคสำคัญที่ทำให้โรงเรียนไม่สามารถรับเด็กเข้าเรียนได้ มาจากข้อจำกัดทางกฎหมายที่เกี่ยวข้องกับระเบียบด้านความมั่นคงระดับพื้นที่ ซึ่งมีแนวปฏิบัติที่เข้มงวดสำหรับเด็กที่เกิดในศูนย์อพยพ กระทรวงศึกษาธิการได้ออกมาชี้แจงว่า ทางกระทรวงฯ ไม่มีอำนาจแทรกแซงกฎระเบียบด้านความมั่นคงดังกล่าว แต่หน้าที่หลักคือการจัดการศึกษาให้เป็นไปตามนโยบายของรัฐ เพื่อหาทางออก กระทรวงศึกษาธิการระบุว่าสิ่งแรกที่ต้องเร่งดำเนินการคือ การพิสูจน์สิทธิของเด็กกลุ่มนี้ เมื่อกระบวนการดังกล่าวเสร็จสิ้นและมีความชัดเจนทางกฎหมาย หน่วยงานด้านการศึกษาจะเข้าไปให้คำแนะนำและช่วยเหลือ เพื่อให้เด็ก ๆ ได้รับโอกาสเข้าเรียนตามสิทธิที่พึงมี กรณีนี้สะท้อนให้เห็นถึงรอยต่อระหว่างกฎหมายความมั่นคงและสิทธิขั้นพื้นฐานด้านการศึกษา ภาครัฐจึงจำเป็นต้องบูรณาการการทำงานระหว่างหน่วยงานอย่างเร่งด่วน เพื่อสร้างกลไกที่ยืดหยุ่นและหาจุดสมดุลที่ไม่ลิดรอนสิทธิเด็ก เพราะการศึกษาคือรากฐานสำคัญในการพัฒนาชีวิต การสร้างมาตรฐานที่ชัดเจนจะช่วยรับประกันว่าเด็กทุกคนบนแผ่นดินไทยจะเข้าถึงการศึกษาได้ โดยไม่ถูกทิ้งไว้ข้างหลังเพียงเพราะเงื่อนไขทางถิ่นกำเนิด", 
                        url: "https://www.thaipbs.or.th/news/content/325697"

            { 
                id: 27, 
                articleNumber: 27, 
                title: "สิทธิในวัฒนธรรมและลิขสิทธิ์", 
                description: "ทุกคนมีสิทธิที่จะเข้าร่วมโดยอิสระในชีวิตทางวัฒนธรรมของชุมชนที่จะเพลิดเพลินกับศิลปะและมีส่วนในความรุดหน้าและคุณประโยชน์ทางวิทยาศาสตร์ ทุกคนมีสิทธิที่จะได้รับการคุ้มครองผลประโยชน์ทางศีลธรรมและทางวัตถุ อันเป็นผลจากประดิษฐกรรมใดทางวิทยาศาสตร์ วรรณกรรม และศิลปกรรมซึ่งตนเป็นผู้สร้าง", 
                caseStudies: [
                    { 
                        text: "เมื่อวันที่ 20 กุมภาพันธ์ 2567 ศาลปกครองสูงสุดได้มีคำพิพากษาครั้งประวัติศาสตร์ สั่งเพิกถอนคำสั่งห้ามฉายภาพยนตร์เรื่อง เชคสเปียร์ต้องตาย (Shakespeare Must Die) และพิพากษาให้คณะกรรมการพิจารณาภาพยนตร์และวีดิทัศน์ต้องชดใช้ค่าเสียหายจากการละเมิดสิทธิให้แก่กลุ่มผู้สร้าง คดีนี้ถือเป็นการปิดฉากการต่อสู้เพื่อเสรีภาพในการแสดงออกทางศิลปะที่ยืดเยื้อยาวนานกว่า 11 ปี โดยนายมานิต ศรีวานิชภูมิ ผู้อำนวยการสร้าง ได้ระบุว่านี่คือวันแห่งชัยชนะของวงการภาพยนตร์ไทย ภาพยนตร์เชคสเปียร์ต้องตาย กำกับโดย สมานรัชฎ์ กาญจนะวณิชย์ เป็นการดัดแปลงจากบทละครโศกนาฏกรรมคลาสสิกเรื่อง แม็คเบธ (Macbeth) ของวิลเลียม เชกสเปียร์ แม้จะได้รับทุนสนับสนุนจากรัฐ แต่กลับถูกคำสั่งแบนห้ามฉายเมื่อวันที่ 3 เมษายน 2555 ด้วยเหตุผลว่ามีภาพที่อิงมาจากเหตุการณ์ 6 ตุลาคม 2519 ซึ่งคณะกรรมการฯ ในขณะนั้นประเมินว่าอาจก่อให้เกิดความแตกสามัคคีในชาติ นัยยะของคำตัดสินนี้เกิดขึ้นพร้อมกับความพยายามเปลี่ยนแปลงโครงสร้างกฎหมายของรัฐบาลปัจจุบัน โดยคณะกรรมการยุทธศาสตร์ซอฟต์พาวเวอร์แห่งชาติ นำโดย แพทองธาร ชินวัตร กำลังผลักดันการแก้ไขกฎกระทรวงภายใต้ พ.ร.บ.ภาพยนตร์และวีดิทัศน์ พ.ศ. 2551 เพื่อปลดล็อกเสรีภาพคนทำหนัง แผนดังกล่าวจะยกเลิกการแบนภาพยนตร์ในประเด็นศาสนา ความมั่นคง และเรื่องเพศ โดยให้เปลี่ยนไปใช้ระบบการจัดเรตติ้งตามความเหมาะสมของผู้ชมแทน และจะคงข้อห้ามฉายไว้เฉพาะกรณีที่เนื้อหากระทบกระเทือนต่อสถาบันพระมหากษัตริย์เท่านั้น ซึ่งปัจจุบันอยู่ในขั้นตอนการรับฟังความคิดเห็นจากประชาชน", 
                        url: "https://theactive.thaipbs.or.th/news/pop-20240220"

                    { 
                        text: "เมื่อวันที่ 16 มกราคม 2568 นายกันตพัฒน์ กุลาสา หรือ มิน กันตพัฒน์ นักร้องลูกทุ่งและศิลปินอิสระ ได้ออกมาร้องเรียนต่อสื่อมวลชนกรณีถูกอินฟลูเอนเซอร์ชื่อดังซึ่งมีผู้ติดตามเกือบ 3 ล้านคน แอบอ้างสิทธิ์ความเป็นเจ้าของลิขสิทธิ์เพลงสอยดาว และดำเนินการเรียกเก็บรายได้ (Monetize) จากผู้ใช้งานบนทุกแพลตฟอร์มออนไลน์ เช่น Facebook, TikTok และ YouTube มาเป็นระยะเวลานานเกือบ 9 เดือน มินชี้แจงว่า เขาได้ซื้อลิขสิทธิ์เพลงนี้มาอย่างถูกต้องแต่เพียงผู้เดียวเมื่อ 5 ปีก่อน เขาตั้งใจอัปโหลดผลงานโดยเจตนาที่จะไม่จดทะเบียนระบบหลังบ้านเพื่อดึงรายได้ (เช่น ระบบ Content ID) เนื่องจากต้องการเปิดโอกาสให้แฟนเพลงและบุคคลทั่วไป สามารถนำเพลงนี้ไปร้องโคฟเวอร์และสร้างรายได้ได้อย่างอิสระโดยไม่ต้องกังวลปัญหาเรื่องลิขสิทธิ์ ทว่าอินฟลูเอนเซอร์รายนี้ได้นำเพลงไปโคฟเวอร์ประกอบภาพยนตร์ และนำไปลงในระบบหลังบ้านเพื่ออ้างสิทธิ์ความเป็นเจ้าของ ทำให้ระบบตรวจสอบและดึงรายได้จากทุกคนที่ใช้เพลงนี้ไปเข้ากระเป๋าของอินฟลูเอนเซอร์แต่เพียงผู้เดียว แม้กระทั่งตัวมินซึ่งเป็นเจ้าของเพลงตัวจริง เมื่อนำคลิปเพลงมาร้องลงเพจของตัวเอง ก็ยังถูกระบบแจ้งเตือนให้แบ่งรายได้ไปให้อินฟลูเอนเซอร์คนดังกล่าว เมื่อมินสอบถามข้อเท็จจริงไปยังอินฟลูเอนเซอร์ กลับได้รับคำตอบที่บ่ายเบี่ยง โยนความผิดไปมา และอ้างว่าระบบหลังบ้านจัดการดึงรายได้เองโดยอัตโนมัติ หลังจากผ่านไป 3 วันโดยไม่มีการขอโทษหรือแสดงความโปร่งใสเรื่องรายได้ มินจึงยื่นคำขาดให้อินฟลูเอนเซอร์เปิดเผยรายได้ทั้งหมดที่ได้จากการเคลมลิขสิทธิ์เพลงนี้ และต้องโอนคืนมาให้เขาทุกบาททุกสตางค์ หากปฏิเสธ เขาเตรียมฟ้องร้องดำเนินคดีตามกฎหมายให้ถึงที่สุด ทั้งนี้ มินยืนยันว่าเป้าหมายหลักคือการปกป้องสิทธิ์อันชอบธรรมของตน และเพื่อรักษาสถานะเพลงให้ทุกคนยังคงนำไปใช้สร้างรายได้ได้ฟรีตามเจตนารมณ์เดิม",

                articleNumber: 28, 
                title: "โลกที่ยุติธรรมและเสรี", 
                description: "ทุกคนย่อมมีสิทธิในระเบียบทางสังคม และระหว่างประเทศ ซึ่งจะเป็นกรอบให้บรรลุสิทธิ และอิสรภาพที่กำหนดไว้ในปฏิญญานี้อย่างเต็มที่", 
                caseStudies: [
                    { 
                        text: "รายงานข่าวเปิดเผยความคืบหน้ากรณีการบังคับสูญหายของนายวันเฉลิม สัตย์ศักดิ์สิทธิ์ นักเคลื่อนไหวทางการเมืองที่ลี้ภัยในประเทศกัมพูชา ซึ่งหายตัวไปนานกว่า 10 เดือน นางสาวสิตานัน สัตย์ศักดิ์สิทธิ์ พี่สาวของนายวันเฉลิม ได้นำหลักฐานใหม่ชิ้นสำคัญเข้ายื่นต่อกรมสอบสวนคดีพิเศษ (DSI) และสำนักงานอัยการสูงสุด เพื่อให้เร่งติดตามหาตัวน้องชายหลักฐานดังกล่าวคือเอกสารบันทึกข้อความของกองบังคับการปราบปรามการกระทำความผิดเกี่ยวกับอาชญากรรมทางเทคโนโลยี (ปอท.) ลงวันที่ 24 มิถุนายน 2561 รายงานการสืบสวนที่เชื่อมโยงถึงนายวันเฉลิม เอกสารนี้มีภาพถ่ายแนบที่ระบุพิกัดอย่างชัดเจน ทั้งภาพรถแท็กซี่ที่ไปรับส่งอดีตแฟนสาว ภาพถ่ายแผนที่และบริเวณหน้าคอนโดมิเนียมแม่โขงการ์เด้น ในกรุงพนมเปญ ซึ่งจุดนี้คือสถานที่เดียวกับที่นายวันเฉลิมถูกกลุ่มชายฉกรรจ์อุ้มหายไปในวันที่ 4 มิถุนายน 2563 นัยสำคัญของเอกสารฉบับนี้คือการยืนยันว่า เจ้าหน้าที่ตำรวจ ปอท. และทางการไทยทราบแหล่งที่พักอาศัยของนายวันเฉลิมในกัมพูชาอย่างละเอียดมาตั้งแต่ปี 2561 ซึ่งข้อมูลนี้ขัดแย้งและสวนทางกับคำชี้แจงก่อนหน้านี้ของกองการต่างประเทศและรองปลัดกระทรวงการต่างประเทศ นอกจากนี้ ยังมีการพบหลักฐานหนังสือเดินทางกัมพูชาของนายวันเฉลิมที่ใช้ชื่อว่า "นายซก เฮง" หลักฐานทั้งหมดนี้ตอกย้ำว่า ทางการของทั้งสองประเทศต่างรับรู้การมีตัวตนและเฝ้าติดตามความเคลื่อนไหวของนายวันเฉลิมในกัมพูชามาโดยตลอด ก่อนที่เขาจะถูกบังคับสูญหายไป", 
                        url: "https://www.thaipbs.or.th/news/content/302811" 
                    },
                    { 
                        text: "คณะกรรมาธิการการพัฒนาการเมือง การสื่อสารมวลชน และการมีส่วนร่วมของประชาชน สภาผู้แทนราษฎร ได้ออกแถลงการณ์ทักท้วงและแสดงจุดยืนคัดค้านกรณีที่รัฐบาลไทยดำเนินการผลักดันชาวอุยกูร์จำนวน 40 คนกลับไปยังประเทศจีนอย่างลับๆ สาระสำคัญของแถลงการณ์ระบุโดยชี้ว่าหน่วยงานที่เกี่ยวข้องได้ปกปิดและซ่อนเร้นข้อมูลการปฏิบัติการ เนื่องจากก่อนหน้านี้ กมธ. ได้เชิญตัวแทนจากหน่วยงานความมั่นคงเข้ามาให้ข้อมูล ซึ่งทุกฝ่ายต่างยืนยันเป็นเสียงเดียวกันว่ายังไม่มีแผนการส่งตัวกลุ่มผู้ลี้ภัยชาวอุยกูร์กลับประเทศต้นทาง แต่ท้ายที่สุดกลับมีการส่งมอบตัวให้ทางการจีนตามมติของสภาความมั่นคงแห่งชาติ (สมช.) กมธ. เน้นย้ำว่า รัฐบาลและหน่วยงานรัฐย่อมตระหนักดีอยู่แล้วว่าการผลักดันชาวอุยกูร์กลับไปยังประเทศจีน (ซินเจียง) มีความเสี่ยงสูงอย่างยิ่งที่บุคคลเหล่านี้จะถูกบังคับให้สูญหาย ดังเช่นกรณีอื้อฉาวเมื่อปี 2558 ที่รัฐบาลไทยเคยส่งผู้ลี้ภัยชาวอุยกูร์ 108 คนกลับจีน ซึ่งจนถึงปัจจุบันเครือญาติก็ไม่สามารถติดต่อบุคคลเหล่านั้นได้อีกเลย การตัดสินใจของรัฐบาลในครั้งนี้จึงสุ่มเสี่ยงต่อการละเมิดหลักการไม่ผลักดันสู่อันตรายอันเป็นบรรทัดฐานสิทธิมนุษยชนระหว่างประเทศ กรณีดังกล่าวยังสะท้อนถึงการจัดการที่ล้มเหลวของรัฐไทย โดยผู้ลี้ภัยชาวอุยกูร์กลุ่มนี้ถูกคุมขังในห้องกักของสำนักงานตรวจคนเข้าเมืองมานานกว่า 10 ปี จนมีผู้เสียชีวิตในระหว่างถูกคุมขังไปแล้วถึง 5 คน แม้ทางรัฐบาลและสถานทูตจีนจะออกมาระบุว่าดำเนินการตามกฎหมาย ทว่านักสิทธิมนุษยชนและ กมธ. มองว่ากระบวนการที่ปกปิดเช่นนี้ ขัดต่อความโปร่งใสและสร้างรอยด่างพร้อยต่อจุดยืนด้านสิทธิมนุษยชนของไทยในเวทีโลก", 
                        url: "https://www.thaipbs.or.th/news/content/349734" 
                    }

            { 
                id: 29, 
                articleNumber: 29, 
                title: "ความรับผิดชอบต่อสังคม", 
                description: "ทุกคนมีหน้าที่ต่อชุมชน ซึ่งการ พัฒนาบุคลิกภาพของตนโดยอิสระและเต็มที่ จะ กระทำได้ก็แต่ในชุมชนเท่านั้น ในการใช้สิทธิและอิสรภาพของตน ทุกคนจะต้องอยู่ภายใต้ข้อจำกัด เพียงเท่าที่มี กำหนดไว้ตามกฎหมายเท่านั้น เพื่อวัตถุประสงค์ของการได้มาซึ่งการยอมรับและการเคารพสิทธิ และอิสรภาพอันควรของผู้อื่น และเพื่อให้สอดรับกับความต้องการอันสมควรทางด้านศีลธรรม ความสงบเรียบร้อยของประชาชน และสวัสดิการทั่วไปในสังคมประชาธิปไตย สิทธิและอิสรภาพเหล่านี้ไม่อาจใช้ขัดต่อวัตถุประสงค์ และหลักการของสหประชาชาติ ไม่ว่าในกรณีใด",

                                    <ScaleIcon /> กรณีศึกษา (ตัวอย่างการละเมิดสิทธิ)
                                </h4>

                                {/* ทำการวนลูป (map) เพื่อแสดงเคสทั้งหมด พร้อมลิงก์ (ถ้ามี) */}
                                {article.caseStudies && article.caseStudies.map((cs, idx) => (
                                    <div key={idx} className={idx > 0 ? "mt-5 pt-5 border-t border-amber-200/60" : ""}>
                                        <p className="text-slate-800 leading-relaxed text-sm sm:text-base italic mb-2">
                                            "{cs.text}"
                                        </p>
                                        {/* เรียกใช้ LinkPreview ต่อเมื่อผู้ใช้ใส่ URL มาแล้วเท่านั้น */}
                                        {hasUrl(cs.url) && <LinkPreview url={cs.url} />}
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-end shrink-0">
                            <button onClick={onClose} className="px-6 py-2 bg-navy text-white rounded-lg hover:bg-navy-light transition-colors font-medium shadow-sm">
                                ปิดหน้าต่าง
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const SituationAnalyzer = ({ udhrData, onArticleClick }) => {
            const [text, setText] = React.useState('');
            const [isAnalyzing, setIsAnalyzing] = React.useState(false);
            const [result, setResult] = React.useState(null);
            const [error, setError] = React.useState('');

            const rungsitImageUrl = "https://i.pinimg.com/736x/97/14/30/971430f33171e8c9f05ca7a3378dc077.jpg";

            const handleAnalyze = async () => {
                if (!text.trim()) {
                    setError('พิมพ์เรื่องราวที่คุณสงสัยมาให้ผมอ่านก่อนสิครับ');
                    return;
                }

                setIsAnalyzing(true);
                setError('');
                setResult(null);

                try {
                    // API Key
                    const apiKey = "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"; 
                    const apiUrl = "https://api.groq.com/openai/v1/chat/completions";

                    const payload = {
                        model: "openai/gpt-oss-20b",
                        messages: [
                            {
                                role: "system",
                                content: `คุณรับบทเป็น "น้องรักสิทธิ" ผู้เชี่ยวชาญด้านสิทธิมนุษยชน (UDHR) ที่มีบุคลิกเป็นมิตร อบอุ่น พร้อมรับฟังและให้คำปรึกษาเหมือนเพื่อนหรือน้องชาย จงวิเคราะห์สถานการณ์ที่ผู้ใช้เล่ามา แล้วตอบกลับเป็นรูปแบบ JSON เท่านั้น โดยต้องมีโครงสร้างดังนี้:
                                {
                                  "violatedArticles": [หมายเลขข้อ 1-30 เช่น 1, 23],
                                  "analysis": "คำอธิบายว่าถูกละเมิดสิทธิอย่างไรบ้าง ตอบในสไตล์การพูดของ 'น้องรักสิทธิ' (แทนตัวเองว่า 'ผม' หรือ 'น้องรักสิทธิ' ใช้หางเสียง 'ครับ')",
                                  "advice": "คำแนะนำด้วยความห่วงใยว่าเขาควรทำอย่างไรต่อไป หรือควรไปปรึกษาใคร"
                                }`
                            },
                            {
                                role: "user",
                                content: text
                            }
                        ],
                        response_format: { type: "json_object" }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        const errorMessage = errorData?.error?.message || "";

                        if (response.status === 401) {
                            throw new Error("API Key ไม่ถูกต้อง หรือถูกบล็อก (รหัส 401)");
                        }
                        if (response.status === 404) {
                            throw new Error(`ไม่พบโมเดลนี้ในระบบ (รหัส 404): ${errorMessage}`);
                        }
                        if (response.status === 429) {
                            throw new Error("ส่งคำขอถี่เกินไป หรือโควต้า API หมดแล้ว (รหัส 429)");
                        }
                        throw new Error(`เซิร์ฟเวอร์ตอบกลับรหัส: ${response.status} ${errorMessage}`);
                    }

                    const apiResult = await response.json();
                    
                    if (apiResult.choices && apiResult.choices.length > 0) {
                        const jsonText = apiResult.choices[0].message.content;
                        const parsedResult = JSON.parse(jsonText);
                        setResult(parsedResult);
                    } else {
                        throw new Error('ระบบผมอาจจะเบลอไปนิดนึงครับ ลองส่งข้อความใหม่อีกครั้งนะ');
                    }
                } catch (err) {
                    console.error("Analysis error:", err);
                    setError(`พบปัญหา: ${err.message}`);
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const matchedArticles = result?.violatedArticles
                ? result.violatedArticles.map(num => udhrData.find(a => a.articleNumber === num)).filter(Boolean)
                : [];

            return (
                <div className="bg-white rounded-3xl shadow-lg border border-slate-100 p-6 sm:p-8 mb-12 relative">
                    <div className="flex flex-col sm:flex-row items-center sm:items-start gap-4 sm:gap-6 mb-8">
                        <div className="w-40 h-40 sm:w-48 sm:h-48 shrink-0 flex items-center justify-center z-10 relative animate-float">
                            <img
                                src={rungsitImageUrl}
                                alt="น้องรักสิทธิ"
                                className="w-full h-full object-contain mix-blend-multiply transition-transform duration-500 hover:scale-110"
                            />
                        </div>

                        <div className="flex-1">
                            <div className="bg-slate-100 p-5 rounded-3xl sm:rounded-tl-none relative shadow-sm chat-bubble text-center sm:text-left">
                                <h2 className="text-xl sm:text-2xl font-bold text-navy mb-2 flex items-center justify-center sm:justify-start gap-2">
                                    ปรึกษา <span className="text-accent">น้องรักสิทธิ</span>
                                </h2>
                                <p className="text-slate-600 leading-relaxed text-sm sm:text-base">
                                    สวัสดีครับ! ผม <strong>"น้องรักสิทธิ"</strong> ยินดีรับฟังและให้คำปรึกษาเรื่องสิทธิมนุษยชนครับ หากคุณหรือคนรู้จักพบเจอเหตุการณ์ที่ไม่เป็นธรรม หรือสงสัยว่าตัวเองถูกละเมิดสิทธิข้อไหน ลองพิมพ์เล่าให้ผมฟังด้านล่างนี้ได้เลยครับ!
                                </p>
                            </div>
                        </div>
                    </div>

                    <div className="space-y-4">
                        <div className="relative">
                            <textarea
                                value={text}
                                onChange={(e) => setText(e.target.value)}
                                placeholder="ตัวอย่าง: ฉันถูกเจ้านายบังคับให้ทำงานล่วงเวลาทุกวันโดยไม่ได้ค่าล่วงเวลา และขู่ว่าจะไล่ออกถ้าไม่ทำตาม..."
                                className="w-full min-h-[120px] p-5 rounded-2xl border border-slate-300 focus:outline-none focus:border-accent focus:ring-4 focus:ring-accent/10 resize-y bg-white text-slate-700 shadow-inner text-base"
                            />
                        </div>
                        
                        {error && <p className="text-red-500 text-sm pl-2 font-medium bg-red-50 p-3 rounded-lg">{error}</p>}

                        <div className="flex justify-end">
                            <button
                                onClick={handleAnalyze}
                                disabled={isAnalyzing || !text.trim()}
                                className="flex items-center gap-2 px-6 py-3.5 bg-navy text-white font-medium rounded-xl hover:bg-navy-light hover:shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
                            >
                                {isAnalyzing ? (
                                    <><LoaderIcon /> <span>น้องรักสิทธิกำลังคิด...</span></>
                                ) : (
                                    <><span>ส่งให้น้องรักสิทธิวิเคราะห์</span> <SendIcon /></>
                                )}
                            </button>
                        </div>
                    </div>

                    {result && (
                        <div className="mt-10 pt-10 border-t border-slate-100 modal-enter">
                            <div className="flex flex-col sm:flex-row gap-4 sm:gap-6">
                                <div className="hidden sm:flex w-24 h-24 shrink-0 items-center justify-center relative animate-float" style={{ animationDelay: '1s' }}>
                                    <img
                                        src={rungsitImageUrl}
                                        alt="น้องรักสิทธิ"
                                        className="w-full h-full object-contain mix-blend-multiply"
                                    />
                                </div>

                                <div className="flex-1 space-y-6">
                                    <div className="bg-blue-50 p-6 rounded-3xl sm:rounded-tl-none border border-blue-100 text-slate-700 shadow-sm relative chat-bubble">
                                        <p className="leading-relaxed whitespace-pre-wrap">{result.analysis}</p>
                                    </div>

                                    <div className="bg-amber-50 p-6 rounded-3xl border border-amber-100 shadow-sm">
                                        <h4 className="flex items-center gap-2 font-bold text-amber-700 mb-3">
                                            <LightbulbIcon /> คำแนะนำจากใจน้องรักสิทธิ
                                        </h4>
                                        <p className="text-amber-900 leading-relaxed">
                                            {result.advice}
                                        </p>
                                    </div>

                                    {matchedArticles.length > 0 && (
                                        <div className="pt-4">
                                            <h4 className="font-semibold text-slate-600 mb-4 text-sm uppercase tracking-wider flex items-center gap-2">
                                                สิทธิที่เกี่ยวข้องกับเรื่องนี้ ({matchedArticles.length} ข้อ)
                                            </h4>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {matchedArticles.map((article) => (
                                                    <div 
                                                        key={article.id}
                                                        onClick={() => onArticleClick(article)}
                                                        className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm hover:border-accent hover:shadow-md cursor-pointer transition-all flex flex-col group"
                                                    >
                                                        <span className="text-xs font-bold text-accent mb-2 px-2 py-1 bg-accent/10 rounded-md self-start">
                                                            ข้อที่ {article.articleNumber}
                                                        </span>
                                                        <h5 className="font-semibold text-navy text-sm mb-2 group-hover:text-accent transition-colors">{article.title}</h5>
                                                        <p className="text-xs text-slate-500 line-clamp-2 mt-auto">{article.description}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    
                                    {matchedArticles.length === 0 && (
                                        <p className="text-slate-500 italic text-center p-6 bg-slate-50 rounded-2xl border border-slate-100">
                                            จากข้อมูลที่เล่ามา น้องรักสิทธิยังไม่พบข้อบัญญัติที่ตรงกับการละเมิดสิทธิอย่างชัดเจนครับ ลองเล่ารายละเอียดเพิ่มเติมให้ผมฟังได้นะ
                                        </p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [searchQuery, setSearchQuery] = React.useState("");
            const [selectedArticle, setSelectedArticle] = React.useState(null);

            const filteredData = React.useMemo(() => {
                if (!searchQuery.trim()) return udhrData;
                const lowerQuery = searchQuery.toLowerCase();
                return udhrData.filter(article => 
                    article.title.toLowerCase().includes(lowerQuery) || 
                    article.articleNumber.toString().includes(lowerQuery) ||
                    article.description.toLowerCase().includes(lowerQuery)
                );
            }, [searchQuery]);

            React.useEffect(() => {
                if (selectedArticle) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = 'unset';
                }
                return () => { document.body.style.overflow = 'unset'; }
            }, [selectedArticle]);

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-navy py-16 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full overflow-hidden opacity-10 pointer-events-none">
                            <div className="absolute -top-24 -right-24 w-96 h-96 bg-accent rounded-full blur-3xl"></div>
                            <div className="absolute top-1/2 -left-24 w-64 h-64 bg-blue-400 rounded-full blur-3xl"></div>
                        </div>

                        <div className="max-w-4xl mx-auto text-center relative z-10">
                            <h1 className="text-3xl sm:text-4xl md:text-5xl font-bold text-white mb-4 leading-tight">
                                สิทธิมนุษยชน <span className="text-accent">30 ประการ</span>
                            </h1>
                            <p className="text-slate-300 text-base sm:text-lg mb-10 max-w-2xl mx-auto">
                                สรุปความรู้และกรณีศึกษาตามปฏิญญาสากลว่าด้วยสิทธิมนุษยชน (Universal Declaration of Human Rights - UDHR) เพื่อความเข้าใจในสิทธิขั้นพื้นฐานของทุกคน
                            </p>
                            
                            <div className="relative max-w-xl mx-auto">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                    <SearchIcon />
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="ค้นหาสิทธิด้วยคำค้นหา หรือ ข้อที่..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="block w-full pl-12 pr-4 py-4 rounded-full bg-white text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-accent/30 shadow-lg transition-shadow text-sm sm:text-base"
                                />
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
                        <SituationAnalyzer udhrData={udhrData} onArticleClick={setSelectedArticle} />

                        {searchQuery && (
                            <div className="mb-6 text-slate-600 font-medium text-center sm:text-left">
                                พบผลลัพธ์ {filteredData.length} รายการ สำหรับการค้นหา "{searchQuery}"
                            </div>
                        )}

                        {filteredData.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {filteredData.map((article) => (
                                    <ArticleCard 
                                        key={article.id} 
                                        article={article} 
                                        onClick={setSelectedArticle}
                                    />
                                ))}
                            </div>
                        ) : (
                            <div className="text-center py-20">
                                <div className="inline-block p-4 bg-white rounded-full shadow-sm mb-4 text-slate-400">
                                    <SearchIcon />
                                </div>
                                <h3 className="text-xl font-medium text-slate-700 mb-2">ไม่พบข้อมูลที่ค้นหา</h3>
                                <p className="text-slate-500">ลองใช้คำค้นหาอื่น หรือค้นหาจากหมายเลขข้อ 1-30</p>
                            </div>
                        )}
                    </main>

                    <footer className="bg-slate-900 pt-12 pb-8 text-center text-slate-400 text-sm">
                        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 mb-10">
                            <h3 className="text-white text-lg font-semibold mb-6 flex items-center justify-center gap-2">
                                <PhoneIcon /> ช่องทางการติดต่อขอความช่วยเหลือด้านสิทธิมนุษยชน
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="bg-slate-800/60 p-5 rounded-2xl border border-slate-700/50 hover:border-slate-600 transition-colors">
                                    <div className="text-accent text-3xl font-bold mb-2">1377</div>
                                    <div className="text-slate-300 font-medium">คณะกรรมการสิทธิมนุษยชนแห่งชาติ (กสม.)</div>
                                </div>
                                <div className="bg-slate-800/60 p-5 rounded-2xl border border-slate-700/50 hover:border-slate-600 transition-colors">
                                    <div className="text-accent text-3xl font-bold mb-2">1567</div>
                                    <div className="text-slate-300 font-medium">ศูนย์ดำรงธรรม</div>
                                </div>
                                <div className="bg-slate-800/60 p-5 rounded-2xl border border-slate-700/50 hover:border-slate-600 transition-colors">
                                    <div className="text-accent text-3xl font-bold mb-2">1300</div>
                                    <div className="text-slate-300 font-medium">ศูนย์ช่วยเหลือสังคม (กระทรวง พม.)</div>
                                </div>
                            </div>
                        </div>

                        <div className="border-t border-slate-800 pt-8 mt-8 max-w-7xl mx-auto">
                            <p>© {new Date().getFullYear()} โครงการเรียนรู้สิทธิมนุษยชน (UDHR Educational Portal)</p>
                            <p className="mt-1">ออกแบบเพื่อส่งเสริมความรู้และความตระหนักในสิทธิมนุษยชนสากล</p>
                        </div>
                    </footer>

                    <ArticleModal 
                        article={selectedArticle} 
                        onClose={() => setSelectedArticle(null)} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
