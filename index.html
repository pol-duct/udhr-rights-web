    <script type="text/babel">
        const udhrData = [
            { id: 1, articleNumber: 1, title: "เราทุกคนเกิดมาเป็นอิสระและเท่าเทียมกัน", description: "มนุษย์ทุกคนเกิดมามีอิสระและเสมอภาคกันในศักดิ์ศรีและสิทธิ ต่างในตนมีเหตุผลและมโนธรรม และควรปฏิบัติต่อกันด้วยเจตนารมณ์แห่งภราดรภาพ", caseStudy: "กรณีที่นักเรียนกลุ่มหนึ่งถูกกีดกันไม่ให้เข้าร่วมกิจกรรมของโรงเรียนเพียงเพราะพวกเขามีความหลากหลายทางเพศ (LGBTQ+) เป็นการละเมิดสิทธิขั้นพื้นฐานแห่งความเท่าเทียม", imageUrl: "https://i.pinimg.com/736x/2b/3f/c7/2b3fc73ad104f9c661830631d3a5dd59.jpg" },
            { id: 2, articleNumber: 2, title: "สิทธิความเสมอภาคและไม่เลือกปฏิบัติ", description: "ทุกคนย่อมมีสิทธิและอิสรภาพโดยปราศจากการแบ่งแยกใดๆ เช่น เชื้อชาติ สีผิว เพศ ภาษา ศาสนา ความคิดเห็นทางการเมือง เผ่าพันธุ์ หรือฐานะทางสังคม", caseStudy: "นายสมชายถูกปฏิเสธการเข้าทำงานในบริษัทแห่งหนึ่ง โดยฝ่ายบุคคลแจ้งเหตุผลว่าเขามาจากภูมิภาคที่บริษัทมีอคติด้วย ถือเป็นการเลือกปฏิบัติอย่างชัดเจน", imageUrl: "https://i.pinimg.com/736x/8f/b1/52/8fb152f1019e16ca7c5949a8d666d602.jpg" },
            { id: 3, articleNumber: 3, title: "สิทธิในการมีชีวิต", description: "ทุกคนมีสิทธิในการมีชีวิต เสรีภาพ และความมั่นคงแห่งบุคคล", caseStudy: "การวิสามัญฆาตกรรมผู้ต้องสงสัยโดยเจ้าหน้าที่รัฐโดยไม่ผ่านกระบวนการยุติธรรม เป็นการพรากสิทธิในการมีชีวิตซึ่งเป็นสิทธิที่ไม่อาจละเมิดได้", imageUrl: "https://i.pinimg.com/736x/8b/d1/cf/8bd1cf5c3c2e78ee7d62a099768f1745.jpg" },
            { id: 4, articleNumber: 4, title: "ห้ามการตกเป็นทาส", description: "บุคคลใดจะถูกยึดเป็นทาสหรือต้องรับใช้เยี่ยงทาสไม่ได้ การค้าทาสทุกรูปแบบเป็นสิ่งต้องห้าม", caseStudy: "แรงงานข้ามชาติถูกยึดหนังสือเดินทางและบังคับให้ทำงานบนเรือประมงโดยไม่ได้ค่าจ้างและไม่สามารถหลบหนีได้ นี่คือการใช้แรงงานทาสยุคใหม่" },
            { id: 5, articleNumber: 5, title: "ห้ามการทรมาน", description: "บุคคลใดจะถูกทรมาน หรือได้รับการปฏิบัติ หรือการลงโทษที่โหดร้าย ไร้มนุษยธรรม หรือย่ำยีศักดิ์ศรีไม่ได้", caseStudy: "ผู้ต้องขังถูกเจ้าหน้าที่สอบสวนใช้ถุงดำคลุมหัวและทำร้ายร่างกายเพื่อให้รับสารภาพ เป็นการทรมานที่ผิดหลักสิทธิมนุษยชนสากล" },
            { id: 6, articleNumber: 6, title: "สิทธิในการได้รับการรับรองทางกฎหมาย", description: "ทุกคนมีสิทธิที่จะได้รับการยอมรับว่าเป็นบุคคลตามกฎหมายไม่ว่าที่ใด", caseStudy: "เด็กไร้สัญชาติที่เกิดในพื้นที่ชายแดนไม่ได้รับใบเกิด ทำให้ไม่มีสิทธิเข้าเรียนในโรงเรียนรัฐหรือรับการรักษาพยาบาลตามสิทธิบัตรทอง" },
            { id: 7, articleNumber: 7, title: "ความเท่าเทียมกันหน้ากฎหมาย", description: "ทุกคนเสมอภาคกันตามกฎหมายและมีสิทธิที่จะได้รับความคุ้มครองของกฎหมายอย่างเท่าเทียมกันโดยปราศจากการเลือกปฏิบัติ", caseStudy: "คนรวยที่ทำผิดกฎหมายจราจรได้รับการปล่อยตัวโดยไม่ถูกปรับ ในขณะที่คนจนทำผิดลักษณะเดียวกันกลับถูกดำเนินคดีอย่างเด็ดขาด สะท้อนถึงความไม่เท่าเทียมทางกฎหมาย" },
            { id: 8, articleNumber: 8, title: "สิทธิได้รับการเยียวยา", description: "ทุกคนมีสิทธิที่จะได้รับการเยียวยาอย่างมีผลจากศาลที่มีอำนาจ เมื่อสิทธิขั้นพื้นฐานของตนถูกละเมิด", caseStudy: "ชาวบ้านที่ถูกเวนคืนที่ดินโดยไม่เป็นธรรมเพื่อสร้างโครงการรัฐ ไม่สามารถหาช่องทางเรียกร้องค่าชดเชยจากศาลปกครองได้ ถือเป็นการละเมิดสิทธินี้" },
            { id: 9, articleNumber: 9, title: "ห้ามการจับกุมโดยพลการ", description: "บุคคลใดจะถูกจับกุม กักขัง หรือเนรเทศตามอำเภอใจไม่ได้", caseStudy: "นักกิจกรรมทางการเมืองถูกกลุ่มคนนอกเครื่องแบบอุ้มตัวขึ้นรถตู้หายไปโดยไม่มีหมายจับหรือการแจ้งข้อกล่าวหา" },
            { id: 10, articleNumber: 10, title: "สิทธิในการพิจารณาคดีที่เป็นธรรม", description: "ทุกคนมีสิทธิอย่างเท่าเทียมกันที่จะได้รับการพิจารณาคดีอย่างเปิดเผยและเป็นธรรมโดยศาลที่เป็นอิสระและเป็นกลาง", caseStudy: "ศาลสั่งพิจารณาคดีลับในข้อหาทั่วไป และไม่อนุญาตให้ทนายความของจำเลยเข้าฟังการสืบพยาน ทำให้กระบวนการยุติธรรมขาดความโปร่งใส" },
            { id: 11, articleNumber: 11, title: "บริสุทธิ์จนกว่าจะพิสูจน์ได้ว่าผิด", description: "ทุกคนที่ถูกกล่าวหาว่ากระทำผิดอาญา มีสิทธิที่จะได้รับการสันนิษฐานไว้ก่อนว่าบริสุทธิ์จนกว่าจะพิสูจน์ได้ว่ามีความผิด", caseStudy: "สื่อมวลชนพาดหัวข่าวตัดสินประณามผู้ต้องสงสัยว่าเป็น 'ฆาตกร' ตั้งแต่ยังไม่มีการสืบสวนและศาลยังไม่ได้ตัดสิน" },
            { id: 12, articleNumber: 12, title: "สิทธิในความเป็นส่วนตัว", description: "บุคคลใดจะถูกแทรกแซงตามอำเภอใจในความเป็นส่วนตัว ครอบครัว เคหสถาน หรือการสื่อสารไม่ได้", caseStudy: "บริษัทแอปพลิเคชันนำข้อมูลตำแหน่งและประวัติการสนทนาส่วนตัวของผู้ใช้ไปขายให้บริษัทโฆษณาโดยไม่ได้รับอนุญาต" },
            { id: 13, articleNumber: 13, title: "เสรีภาพในการเดินทาง", description: "ทุกคนมีเสรีภาพในการเคลื่อนย้ายและอยู่อาศัยภายในพรมแดนของแต่ละรัฐ และมีสิทธิที่จะออกและกลับเข้าประเทศตน", caseStudy: "รัฐบาลออกคำสั่งห้ามประชาชนจากจังหวัดหนึ่งเดินทางเข้าเมืองหลวงเพื่อร่วมกิจกรรมสาธารณะโดยไม่มีเหตุผลด้านความมั่นคงที่ชัดเจน" },
            { id: 14, articleNumber: 14, title: "สิทธิในการลี้ภัย", description: "ทุกคนมีสิทธิที่จะแสวงหาและได้ที่ลี้ภัยในประเทศอื่นจากการประหัตประหาร", caseStudy: "ผู้ลี้ภัยสงครามที่ข้ามพรมแดนมาเพื่อขอความช่วยเหลือ ถูกผลักดันกลับสู่พื้นที่สู้รบทันทีโดยไม่ได้รับการประเมินสถานะ" },
            { id: 15, articleNumber: 15, title: "สิทธิในสัญชาติ", description: "ทุกคนมีสิทธิในการมีสัญชาติ บุคคลใดจะถูกลิดรอนสัญชาติของตนตามอำเภอใจไม่ได้", caseStudy: "ชนพื้นเมืองที่อาศัยอยู่ในป่าลึกมาหลายชั่วอายุคน ถูกรัฐปฏิเสธการให้บัตรประชาชนและสัญชาติ ทำให้กลายเป็นคนเถื่อน" },
            { id: 16, articleNumber: 16, title: "สิทธิในการแต่งงานและครอบครัว", description: "ชายและหญิงที่บรรลุนิติภาวะแล้ว มีสิทธิที่จะแต่งงานและสร้างครอบครัวโดยปราศจากการจำกัดเรื่องเชื้อชาติ สัญชาติ หรือศาสนา", caseStudy: "กฎหมายในบางประเทศไม่อนุญาตให้คู่รักต่างศาสนาจดทะเบียนสมรสกันได้ หากอีกฝ่ายไม่เปลี่ยนศาสนาเสียก่อน" },
            { id: 17, articleNumber: 17, title: "สิทธิในทรัพย์สิน", description: "ทุกคนมีสิทธิในการเป็นเจ้าของทรัพย์สิน และจะถูกยึดทรัพย์ไปโดยพลการไม่ได้", caseStudy: "นายทุนร่วมมือกับเจ้าหน้าที่รัฐ ขับไล่ชุมชนดั้งเดิมออกจากพื้นที่และยึดที่ดินของพวกเขามาสร้างรีสอร์ท" },
            { id: 18, articleNumber: 18, title: "เสรีภาพทางความคิดและศาสนา", description: "ทุกคนมีเสรีภาพทางความคิด มโนธรรม และศาสนา สิทธิที่จะเปลี่ยนศาสนาหรือความเชื่อ และสิทธิในการแสดงออกทางศาสนา", caseStudy: "พนักงานบริษัทถูกบีบบังคับให้เข้าร่วมพิธีกรรมทางศาสนาที่ขัดต่อความเชื่อส่วนบุคคลของตน หากไม่เข้าร่วมจะถูกหักเงินเดือน" },
            { id: 19, articleNumber: 19, title: "เสรีภาพในการแสดงออก", description: "ทุกคนมีเสรีภาพในการแสดงความคิดเห็นและการแสดงออก ซึ่งรวมถึงการถือครองความเห็นโดยปราศจากการแทรกแซง", caseStudy: "นักศึกษาถูกตั้งข้อหาร้ายแรงเพียงเพราะเขียนบทความวิจารณ์นโยบายเศรษฐกิจของรัฐบาลอย่างสันติ" },
            { id: 20, articleNumber: 20, title: "เสรีภาพในการชุมนุม", description: "ทุกคนมีเสรีภาพในการชุมนุมและการสมาคมอย่างสันติ", caseStudy: "ตำรวจใช้รถฉีดน้ำแรงดันสูงและแก๊สน้ำตา สลายการชุมนุมของกลุ่มชาวบ้านที่มานั่งประท้วงเรียกร้องปัญหาราคาสินค้าเกษตรตกต่ำอย่างสงบ" },
            { id: 21, articleNumber: 21, title: "สิทธิในการมีส่วนร่วมทางการเมือง", description: "ทุกคนมีสิทธิที่จะมีส่วนร่วมในรัฐบาลของประเทศตน ไม่ว่าโดยตรงหรือผ่านผู้แทนที่เลือกตั้งมาอย่างเสรี", caseStudy: "การตัดสิทธิผู้มีสิทธิเลือกตั้งจำนวนมากโดยพลการ เพื่อเอื้อประโยชน์ให้พรรคการเมืองฝ่ายรัฐบาลชนะการเลือกตั้ง" },
            { id: 22, articleNumber: 22, title: "สิทธิในความมั่นคงทางสังคม", description: "ทุกคนในฐานะสมาชิกของสังคม มีสิทธิในความมั่นคงทางสังคม และการทำให้บรรลุถึงสิทธิทางเศรษฐกิจ สังคม และวัฒนธรรม", caseStudy: "ผู้สูงอายุที่ยากไร้ไม่ได้รับเบี้ยยังชีพหรือสวัสดิการใดๆ จากรัฐ ทำให้ต้องใช้ชีวิตอย่างยากลำบากไร้หลักประกันในบั้นปลายชีวิต" },

                        </div>
                    </div>

                    {/* Chat Results Area */}
                    {result && (
                        <div className="mt-10 pt-10 border-t border-slate-100 modal-enter">
                            <div className="flex flex-col sm:flex-row gap-4 sm:gap-6">
                                
                                {/* Avatar again for the reply: เอาขอบและพื้นหลังออก ใส่เอฟเฟกต์ลอย */}
                                <div className="hidden sm:flex w-24 h-24 shrink-0 items-center justify-center relative animate-float" style={{ animationDelay: '1s' }}>
                                    <img
                                        src={rungsitImageUrl}
                                        alt="น้องรักสิทธิ"
                                        className="w-full h-full object-contain mix-blend-multiply"
                                    />
                                </div>

                                <div className="flex-1 space-y-6">
                                    {/* AI Analysis Reply */}
                                    <div className="bg-blue-50 p-6 rounded-3xl sm:rounded-tl-none border border-blue-100 text-slate-700 shadow-sm relative chat-bubble">
                                        <p className="leading-relaxed whitespace-pre-wrap">{result.analysis}</p>
                                    </div>

                                    {/* AI Advice */}
                                    <div className="bg-amber-50 p-6 rounded-3xl border border-amber-100 shadow-sm">
                                        <h4 className="flex items-center gap-2 font-bold text-amber-700 mb-3">
                                            <LightbulbIcon /> คำแนะนำจากใจน้องรักสิทธิ
                                        </h4>
                                        <p className="text-amber-900 leading-relaxed">
                                            {result.advice}
                                        </p>
                                    </div>

                                    {/* Matched Articles Grid */}
                                    {matchedArticles.length > 0 && (
                                        <div className="pt-4">
                                            <h4 className="font-semibold text-slate-600 mb-4 text-sm uppercase tracking-wider flex items-center gap-2">
                                                สิทธิที่เกี่ยวข้องกับเรื่องนี้ ({matchedArticles.length} ข้อ)
                                            </h4>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {matchedArticles.map((article) => (
                                                    <div 
                                                        key={article.id}
                                                        onClick={() => onArticleClick(article)}
                                                        className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm hover:border-accent hover:shadow-md cursor-pointer transition-all flex flex-col group"
                                                    >
                                                        <span className="text-xs font-bold text-accent mb-2 px-2 py-1 bg-accent/10 rounded-md self-start">
                                                            ข้อที่ {article.articleNumber}
                                                        </span>
                                                        <h5 className="font-semibold text-navy text-sm mb-2 group-hover:text-accent transition-colors">{article.title}</h5>
                                                        <p className="text-xs text-slate-500 line-clamp-2 mt-auto">{article.description}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    
                                    {matchedArticles.length === 0 && (
                                        <p className="text-slate-500 italic text-center p-6 bg-slate-50 rounded-2xl border border-slate-100">
                                            จากข้อมูลที่เล่ามา น้องรักสิทธิยังไม่พบข้อบัญญัติที่ตรงกับการละเมิดสิทธิอย่างชัดเจนครับ ลองเล่ารายละเอียดเพิ่มเติมให้ผมฟังได้นะ
                                        </p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [searchQuery, setSearchQuery] = React.useState("");
            const [selectedArticle, setSelectedArticle] = React.useState(null);

            const filteredData = React.useMemo(() => {
                if (!searchQuery.trim()) return udhrData;
                const lowerQuery = searchQuery.toLowerCase();
                return udhrData.filter(article => 
                    article.title.toLowerCase().includes(lowerQuery) || 
                    article.articleNumber.toString().includes(lowerQuery) ||
                    article.description.toLowerCase().includes(lowerQuery)
                );
            }, [searchQuery]);

            React.useEffect(() => {
                if (selectedArticle) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = 'unset';
                }
                return () => { document.body.style.overflow = 'unset'; }
            }, [selectedArticle]);

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-navy py-16 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full overflow-hidden opacity-10 pointer-events-none">
                            <div className="absolute -top-24 -right-24 w-96 h-96 bg-accent rounded-full blur-3xl"></div>
                            <div className="absolute top-1/2 -left-24 w-64 h-64 bg-blue-400 rounded-full blur-3xl"></div>
                        </div>

                        <div className="max-w-4xl mx-auto text-center relative z-10">
                            <h1 className="text-3xl sm:text-4xl md:text-5xl font-bold text-white mb-4 leading-tight">
                                สิทธิมนุษยชน <span className="text-accent">30 ประการ</span>
                            </h1>
                            <p className="text-slate-300 text-base sm:text-lg mb-10 max-w-2xl mx-auto">
                                สรุปความรู้และกรณีศึกษาตามปฏิญญาสากลว่าด้วยสิทธิมนุษยชน (Universal Declaration of Human Rights - UDHR) เพื่อความเข้าใจในสิทธิขั้นพื้นฐานของทุกคน
                            </p>
                            
                            <div className="relative max-w-xl mx-auto">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                    <SearchIcon />
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="ค้นหาสิทธิด้วยคำค้นหา หรือ ข้อที่..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="block w-full pl-12 pr-4 py-4 rounded-full bg-white text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-accent/30 shadow-lg transition-shadow text-sm sm:text-base"
                                />
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
                        
                        {/* ใช้งานระบบปรึกษาน้องรักสิทธิ */}
                        <SituationAnalyzer udhrData={udhrData} onArticleClick={setSelectedArticle} />

                        {searchQuery && (
                            <div className="mb-6 text-slate-600 font-medium text-center sm:text-left">
                                พบผลลัพธ์ {filteredData.length} รายการ สำหรับการค้นหา "{searchQuery}"
                            </div>
                        )}

                        {filteredData.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {filteredData.map((article) => (
                                    <ArticleCard 
                                        key={article.id} 
                                        article={article} 
                                        onClick={setSelectedArticle}
                                    />
                                ))}
                            </div>
                        ) : (
                            <div className="text-center py-20">
                                <div className="inline-block p-4 bg-white rounded-full shadow-sm mb-4 text-slate-400">
                                    <SearchIcon />
                                </div>
                                <h3 className="text-xl font-medium text-slate-700 mb-2">ไม่พบข้อมูลที่ค้นหา</h3>
                                <p className="text-slate-500">ลองใช้คำค้นหาอื่น หรือค้นหาจากหมายเลขข้อ 1-30</p>
                            </div>
                        )}
                    </main>

                    {}
                    <footer className="bg-slate-900 pt-12 pb-8 text-center text-slate-400 text-sm">
                        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 mb-10">
                            <h3 className="text-white text-lg font-semibold mb-6 flex items-center justify-center gap-2">
                                <PhoneIcon /> ช่องทางการติดต่อขอความช่วยเหลือด้านสิทธิมนุษยชน
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="bg-slate-800/60 p-5 rounded-2xl border border-slate-700/50 hover:border-slate-600 transition-colors">
                                    <div className="text-accent text-3xl font-bold mb-2">1377</div>
                                    <div className="text-slate-300 font-medium">คณะกรรมการสิทธิมนุษยชนแห่งชาติ (กสม.)</div>
                                </div>
                                <div className="bg-slate-800/60 p-5 rounded-2xl border border-slate-700/50 hover:border-slate-600 transition-colors">
                                    <div className="text-accent text-3xl font-bold mb-2">1567</div>
                                    <div className="text-slate-300 font-medium">ศูนย์ดำรงธรรม</div>
                                </div>
                                <div className="bg-slate-800/60 p-5 rounded-2xl border border-slate-700/50 hover:border-slate-600 transition-colors">
                                    <div className="text-accent text-3xl font-bold mb-2">1300</div>
                                    <div className="text-slate-300 font-medium">ศูนย์ช่วยเหลือสังคม (กระทรวง พม.)</div>
                                </div>
                            </div>
                        </div>

                        <div className="border-t border-slate-800 pt-8 mt-8 max-w-7xl mx-auto">
                            <p>© {new Date().getFullYear()} โครงการเรียนรู้สิทธิมนุษยชน (UDHR Educational Portal)</p>
                            <p className="mt-1">ออกแบบเพื่อส่งเสริมความรู้และความตระหนักในสิทธิมนุษยชนสากล</p>
                        </div>
                    </footer>

                    <ArticleModal 
                        article={selectedArticle} 
                        onClose={() => setSelectedArticle(null)} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
